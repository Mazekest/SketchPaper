# SketchPaper 2.4

screen = <profile> <empty> [WOBBLE] [LINES] [FOLIAGE] [HATCH] [PAPER] [SKY] WATER_OPACITY COLOR_MIX <empty> [ADVANCED]

screen.WOBBLE  = SKETCH_FPS WOBBLE_AMOUNT WOBBLE_SCALE
screen.LINES   = LINE_CURVE_THRESHOLD LINE_DEPTH_STRENGTH LINE_DEPTH_THRESHOLD LINE_LUMA_STRENGTH LINE_LUMA_THRESHOLD LINE_DARKNESS WATER_LINES LINE_FADE_DIST LINE_FADE_FLOOR LINE_FADE_DEPTH LINE_FADE_STEPS LINE_FADE_CURVE LINE_DETAIL_MIN TONE_FADE
screen.FOLIAGE = FOLIAGE_CALM FOLIAGE_RADIUS
screen.HATCH   = HATCH_ANCHOR TONE_LEVELS HATCH_STRENGTH HATCH_SPACING HATCH_WIDTH HATCH_ANGLE HATCH_ROUGH HATCH_JITTER
screen.PAPER   = PAPER_GRAIN
screen.SKY     = SUN_CUTOFF SUN_TONE HIDE_CLOUDS

# Tucked away so it doesn't sit on the main screen. Only useful when
# something looks wrong and you want to see an intermediate stage.
screen.ADVANCED = EDGE_MODE LINE_FADE_MODE DEBUG_VIEW

sliders = SKETCH_FPS WOBBLE_AMOUNT WOBBLE_SCALE \
          LINE_CURVE_THRESHOLD LINE_DEPTH_STRENGTH LINE_DEPTH_THRESHOLD \
          LINE_LUMA_STRENGTH LINE_LUMA_THRESHOLD LINE_DARKNESS \
          LINE_FADE_DIST LINE_FADE_FLOOR LINE_FADE_DEPTH LINE_FADE_STEPS LINE_FADE_CURVE LINE_DETAIL_MIN TONE_FADE \
          FOLIAGE_CALM FOLIAGE_RADIUS \
          TONE_LEVELS HATCH_STRENGTH HATCH_SPACING HATCH_WIDTH HATCH_ANGLE HATCH_ROUGH HATCH_JITTER \
          PAPER_GRAIN COLOR_MIX WATER_OPACITY SUN_CUTOFF SUN_TONE DEBUG_VIEW

# Presets, switched with the button at the top of the settings screen.
# DEFAULT is the shipped configuration - use it to get back if you lose
# track of what you changed.

profile.DEFAULT = SKETCH_FPS=4.0 WOBBLE_AMOUNT=0.0030 WOBBLE_SCALE=7.0 \
  EDGE_MODE=1 LINE_CURVE_THRESHOLD=0.02 LINE_DEPTH_STRENGTH=1.0 LINE_DEPTH_THRESHOLD=0.035 \
  LINE_LUMA_STRENGTH=1.0 LINE_LUMA_THRESHOLD=0.14 LINE_DARKNESS=0.85 WATER_LINES=1 \
  LINE_FADE_DIST=48.0 LINE_FADE_FLOOR=0.15 LINE_FADE_DEPTH=0.35 \
  LINE_FADE_MODE=1 LINE_FADE_STEPS=5.0 LINE_FADE_CURVE=0.6 \
  LINE_DETAIL_MIN=24.0 TONE_FADE=0.5 \
  FOLIAGE_CALM=0.75 FOLIAGE_RADIUS=4.0 \
  HATCH_ANCHOR=0 TONE_LEVELS=4.0 HATCH_STRENGTH=0.5 HATCH_SPACING=4.0 HATCH_WIDTH=0.16 \
  HATCH_ANGLE=45.0 HATCH_ROUGH=0.6 HATCH_JITTER=0.25 \
  PAPER_GRAIN=0.16 COLOR_MIX=0.0 WATER_OPACITY=0.22 SUN_CUTOFF=0.55 SUN_TONE=0.72 \
  HIDE_CLOUDS=0 DEBUG_VIEW=0

# ---- EYECARE: the least visually noisy setting available. ----
# Everything that produces high-frequency detail is turned down or off, and
# the distance separation is pushed to maximum so overlapping masses stay
# readable as separate layers. Loses the finest leaf texture in exchange.
profile.EYECARE = profile.DEFAULT SKETCH_FPS=3.0 WOBBLE_AMOUNT=0.0010 \
  LINE_LUMA_STRENGTH=0.25 LINE_DETAIL_MIN=72.0 \
  LINE_FADE_DIST=24.0 LINE_FADE_CURVE=0.4 LINE_FADE_DEPTH=0.5 LINE_FADE_STEPS=4.0 \
  TONE_FADE=0.9 FOLIAGE_CALM=1.0 FOLIAGE_RADIUS=9.0 \
  HATCH_STRENGTH=0.35 HATCH_JITTER=0.0

# ---- CALM: motion, not detail. ----
# The drawing keeps its detail; it just stops moving around. Slowest redraw,
# smallest wobble, no hatch jitter. For long play sessions.
profile.CALM = profile.DEFAULT SKETCH_FPS=1.5 WOBBLE_AMOUNT=0.0005 \
  HATCH_JITTER=0.0 HATCH_ROUGH=0.35 \
  LINE_DETAIL_MIN=32.0 TONE_FADE=0.7

# ---- CRISP: sharp, clean linework. ----
# Crisp means the marks are crisp, not that the image shakes faster - the
# wobble is dialled down, not up. For screenshots and wallpapers.
profile.CRISP = profile.DEFAULT SKETCH_FPS=3.0 WOBBLE_AMOUNT=0.0005 \
  HATCH_JITTER=0.0 HATCH_ROUGH=0.0 HATCH_WIDTH=0.10 \
  FOLIAGE_CALM=0.35 LINE_DETAIL_MIN=12.0 LINE_DARKNESS=1.0 \
  LINE_FADE_DIST=96.0 LINE_FADE_DEPTH=0.2 LINE_FADE_STEPS=7.0 TONE_FADE=0.3

# ---- COLOR: original block colours partly restored. ----
profile.COLOR = profile.DEFAULT COLOR_MIX=0.3

# ---- CHAOS: every restraint removed. ----
# Fastest redraw, largest wobble, maximum jitter, every detail line drawn and
# no distance separation at all. This is the setting the other five exist to
# avoid. Not recommended for actually playing.
profile.CHAOS = profile.DEFAULT SKETCH_FPS=24.0 WOBBLE_AMOUNT=0.0090 WOBBLE_SCALE=14.0 \
  HATCH_JITTER=0.7 HATCH_ROUGH=1.0 HATCH_STRENGTH=0.8 HATCH_SPACING=4.0 \
  LINE_LUMA_STRENGTH=1.5 LINE_DETAIL_MIN=0.0 LINE_DARKNESS=1.0 \
  LINE_FADE_DIST=192.0 LINE_FADE_DEPTH=0.0 TONE_FADE=0.0 \
  FOLIAGE_CALM=0.0 TONE_LEVELS=6.0

# Four arguments required: srcRGB dstRGB srcAlpha dstAlpha
blend.gbuffers_skytextured = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

underwaterOverlay = false
vignette = false
